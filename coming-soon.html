<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2f78">
<meta name="description" content="Oros Stokvel is coming soon. Stand a chance to win your share of R20 000.">
<title>Oros Stokvel - Coming Soon</title>

<meta property="og:type" content="website">
<meta property="og:site_name" content="Oros Stokvel">
<meta property="og:title" content="Oros Stokvel - Coming Soon">
<meta property="og:description" content="Something delicious is on the way. Stand a chance to win your share of R20 000.">
<meta property="og:image" content="https://orosstokvel.co.za/demo/assets/share-card.png">
<meta property="og:locale" content="en_ZA">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Montserrat:wght@500;700;800&display=swap">
<link rel="icon" type="image/png" sizes="32x32" href="assets/mascot-icon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/mascot-icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/mascot-icon-180.png">
<link rel="preload" as="image" href="assets/wordmark.png">

<style>
  :root {
    --oros-blue: #1d2f78;
    --oros-blue-mid: #0f4ea4;
    --oros-blue-light: #1360ae;
    --oros-yellow: #fcd92e;
    --oros-orange: #f58220;
    --oros-pink: #d41b6a;
    --oros-text: #14306f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #fff;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #253f75 0%, #17294f 48%, #0b1630 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background:
      radial-gradient(ellipse 70% 55% at 50% 42%,
        var(--oros-blue-light) 0%, var(--oros-blue-mid) 45%, #2d3a8f 100%),
      var(--oros-blue);
  }

  .frame {
    position: absolute;
    inset: 0;
    width: min(100%, calc(100dvh * 9 / 16));
    height: 100%;
    margin-inline: auto;
    container-type: inline-size;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 6cqw 5cqw;
  }

  @media (min-width: 1200px) and (min-height: 700px) and (hover: hover) and (pointer: fine) {
    body { padding: 4vh 4vw; }
    .stage {
      width: min(90vw, calc(92dvh * 9 / 16));
      height: min(92dvh, calc(90vw * 16 / 9));
      border: 1px solid rgba(139, 183, 255, 0.42);
      border-radius: 1.2rem;
      outline: 1px solid rgba(5, 15, 40, 0.8);
      box-shadow:
        inset 2px 2px 0 rgba(255, 255, 255, 0.16),
        0 30px 70px rgba(0, 0, 0, 0.55);
    }
  }

  .deco {
    position: absolute;
    pointer-events: none;
    user-select: none;
  }
  .deco img { display: block; width: 100%; height: auto; }

  .fruit-tl   { left: 4%;  top: 5%;  width: 18cqw; animation: float 7s ease-in-out infinite; }
  .fruit-tr   { right: 4%; top: 7%;  width: 22cqw; animation: float 8s ease-in-out -2s infinite; }
  .fruit-ml   { left: -2%; top: 46%; width: 20cqw; animation: float 9s ease-in-out -1s infinite; }
  .bottle-l   { left: -8%; bottom: 2%;  width: 55cqw; animation: bob 6s ease-in-out infinite; }
  .bottle-r   { right: -10%; bottom: 4%; width: 58cqw; animation: bob 7s ease-in-out -2.3s infinite; }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-14px) rotate(-5deg); }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-10px) rotate(2deg); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.04); opacity: 0.9; }
  }

  .wordmark {
    position: relative;
    z-index: 3;
    width: 78%;
    max-width: 420px;
    margin-top: 2cqw;
  }
  .wordmark img { width: 100%; height: auto; display: block; }

  .content {
    position: relative;
    z-index: 4;
    margin-top: auto;
    margin-bottom: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.5cqw;
  }

  .badge {
    display: inline-block;
    background: var(--oros-yellow);
    color: var(--oros-text);
    font-family: 'Baloo 2', 'Montserrat', sans-serif;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2.2cqw 5cqw;
    border-radius: 999px;
    font-size: 4.2cqw;
    box-shadow:
      0 6px 0 rgba(0, 0, 0, 0.18),
      inset 0 -3px 0 rgba(0, 0, 0, 0.08);
    animation: pulse 2.4s ease-in-out infinite;
  }

  .headline {
    font-family: 'Baloo 2', 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 14cqw;
    line-height: 0.95;
    color: var(--oros-yellow);
    text-shadow:
      0 4px 0 var(--oros-pink),
      0 8px 16px rgba(0, 0, 0, 0.35);
    letter-spacing: 0.01em;
  }
  .headline .amp { color: #fff; }

  .sub {
    font-weight: 700;
    font-size: 5.2cqw;
    line-height: 1.2;
    max-width: 90%;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
  }

  .divider {
    width: 40%;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--oros-yellow), transparent);
    opacity: 0.8;
  }

  .fine {
    font-weight: 500;
    font-size: 3.4cqw;
    line-height: 1.5;
    opacity: 0.92;
    max-width: 86%;
  }
  .fine strong { color: var(--oros-yellow); font-weight: 800; }

  .footer-note {
    position: relative;
    z-index: 4;
    margin-top: auto;
    padding-top: 3cqw;
    font-size: 2.8cqw;
    opacity: 0.7;
    letter-spacing: 0.04em;
  }

  @media (prefers-reduced-motion: reduce) {
    .deco, .badge { animation: none !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="frame">

    <div class="deco fruit-tl"><img src="assets/orange-small.png" alt=""></div>
    <div class="deco fruit-tr"><img src="assets/mango.png" alt=""></div>
    <div class="deco fruit-ml"><img src="assets/lemon-small.png" alt=""></div>
    <div class="deco bottle-l"><img src="assets/splash-left.png" alt=""></div>
    <div class="deco bottle-r"><img src="assets/splash-right.png" alt=""></div>

    <div class="wordmark">
      <img src="assets/wordmark.png" alt="Taste the Fun with Oros">
    </div>

    <div class="content">
      <span class="badge">Coming Soon</span>
      <div class="headline">Something<br>Juicy<br><span class="amp">is on the way</span></div>
      <div class="divider"></div>
      <div class="sub">Stand a chance to win your share of <strong style="color:var(--oros-yellow)">R20 000</strong>.</div>
      <div class="fine">Our Oros Stokvel competition drops <strong>soon</strong>. Check back here to enter.</div>
    </div>

    <div class="footer-note">&copy; Oros Stokvel - Taste the Fun</div>

  </div>
</div>

</body>
</html>
