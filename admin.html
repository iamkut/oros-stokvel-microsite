<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d2f78">
<meta name="robots" content="noindex, nofollow">
<title>Oros Stokvel - Admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/mascot-icon-32.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="admin" id="admin">
  <h1>Oros Stokvel - Entries</h1>
  <div class="meta" id="admin-meta">Loading...</div>
  <div class="actions">
    <a class="link-btn" id="a-csv" href="/api/admin/export.csv">Download CSV</a>
    <button type="button" id="a-pdf" class="secondary">Print / PDF</button>
    <button type="button" id="a-refresh" class="secondary">Refresh</button>
    <a class="link-btn secondary" href="/">Back to microsite</a>
  </div>
  <div id="admin-table"></div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  function escapeHTML(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function render(entries) {
    $('admin-meta').textContent = entries.length + ' ' +
      (entries.length === 1 ? 'entry' : 'entries') + '.';
    var tbl = $('admin-table');
    if (!entries.length) {
      tbl.innerHTML = '<div class="empty">No entries yet.</div>';
      return;
    }
    var head = '<tr><th>#</th><th>Timestamp</th><th>Name</th><th>Phone</th>' +
      '<th>Flavour</th><th>Opt-in</th><th>Consent</th></tr>';
    var body = entries.map(function (r, i) {
      return '<tr>' +
        '<td>' + (i + 1) + '</td>' +
        '<td>' + escapeHTML(r.created_at) + '</td>' +
        '<td>' + escapeHTML(r.name) + '</td>' +
        '<td>' + escapeHTML(r.phone) + '</td>' +
        '<td>' + escapeHTML(r.flavour) + '</td>' +
        '<td>' + (r.opt_in ? 'Yes' : 'No') + '</td>' +
        '<td>' + (r.consent ? 'Yes' : 'No') + '</td>' +
      '</tr>';
    }).join('');
    tbl.innerHTML = '<table>' + head + body + '</table>';
  }

  function load() {
    $('admin-meta').textContent = 'Loading...';
    fetch('/api/admin/entries', { credentials: 'include' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) { render(data.entries || []); })
      .catch(function (err) {
        $('admin-meta').textContent = 'Failed to load entries: ' + err.message;
      });
  }

  $('a-pdf').addEventListener('click', function () { window.print(); });
  $('a-refresh').addEventListener('click', load);

  load();
})();
</script>
</body>
</html>
