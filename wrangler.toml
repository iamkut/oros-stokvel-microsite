name = "oros-stokvel-microsite-staging"
compatibility_date = "2026-01-01"
pages_build_output_dir = "."

# This file lives on the `staging` branch and powers the
# `oros-stokvel-microsite-staging` Pages project (production branch: staging).
# The production project (`oros-stokvel-microsite`, main branch) has its own
# wrangler.toml with the prod D1/vars.

# Cloudflare's always-passes Turnstile test key — safe for staging.
[vars]
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
CAMPAIGN = "stokvel-2026-staging"

# Secrets (set via dashboard or wrangler, NOT committed):
#   wrangler pages secret put DAILY_SALT --project-name=oros-stokvel-microsite-staging
#   wrangler pages secret put TURNSTILE_SECRET --project-name=oros-stokvel-microsite-staging

[[d1_databases]]
binding = "DB"
database_name = "oros-stokvel-staging"
database_id = "23f5b507-a4b3-4317-8bc3-13e9ff04b645"
